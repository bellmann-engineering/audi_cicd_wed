name: CI/CD

on:
  workflow_dispatch:

#on:
#  push:
#    branches:
#      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y cppcheck clang-tidy

      - name: stylecheck
        run: cppcheck --enable=style,warning,performance --error-exitcode=1 main.cpp

#      - name: clang-tidy
#        run: clang-tidy main.cpp -checks='bugprone-*,performance-*,readability-*,modernize-*' -warnings-as-errors='*' -- -std=c++17


  unittest:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install GoogleTest
        run: sudo apt-get install -y g++ libgtest-dev

      - name: Build unit tests
        run: g++ test_calc.cpp -o unittests -std=c++17 -Wall -lgtest -lgtest_main -pthread && ./unittests


  coverage:
    needs: unittest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y g++ libgtest-dev lcov

      - name: Build and run tests with coverage
        run: |
          g++ test_calc.cpp -o unittests -std=c++17 -O0 --coverage -lgtest -lgtest_main -pthread
          ./unittests

      - name: Create coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,inconsistent,unused --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors mismatch,inconsistent,unused
          lcov --list coverage.info --ignore-errors mismatch,inconsistent
          genhtml coverage.info --output-directory coverage-report --ignore-errors mismatch,inconsistent

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report


  build:
    needs: unittest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [14, 17, 20]

    name: Build (${{ matrix.compiler }}, C++${{ matrix.std }})

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Install compilers
        run: sudo apt-get install -y g++ clang

      - name: Build
        run: ${{ matrix.compiler }} main.cpp -o programm -std=c++${{ matrix.std }} -Wall

      - name: Test
        run: |
          OUTPUT=$(./programm)
          if [ "$OUTPUT" = "Hello" ]; then
            echo "Test bestanden"
          else
            echo "Test fehlgeschlagen: '$OUTPUT'"
            exit 1
          fi


  deploy:
    needs: [build, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code from Git
        uses: actions/checkout@v4

      - name: Build release binary
        run: g++ main.cpp -o programm -std=c++17 -O2

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: programm
          path: programm

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Erster Release mit Unit Tests.
            Binary für Linux (x64).
          files: programm
